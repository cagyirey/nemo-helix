#
# The minikube quickstart's platform config, the `nemo-helix-config` ConfigMap.
#
# LOCAL ONLY. Change each of these before starting a shared cluster from it:
#
#   - auth is off, so every request acts as the admin and no permission check runs
#   - `secrets.allow_key_creation` keeps the encryption key on the pod's own disk
#   - the registry is in-cluster and plain HTTP, and its token service is a local stand-in
#   - with auth off, the builder's credential broker checks no caller: anything that reaches the
#     platform, a build's own `RUN` included, can get push tokens and signatures
#   - `repository_prefix` is empty (see "Configuration" in the README)
#   - finished jobs keep their pods and work directories for an hour
#   - the sandbox is sized for a laptop
#   - the images are side-loaded with `minikube image load`, so there is no image pull secret

platform:
  runtime: "kubernetes"
  base_url: "http://nemo-helix.nhx-platform.svc.cluster.local:8080"

service: {}

auth:
  enabled: false
  allow_unsigned_jwt: true
  policy_decision_point_provider: embedded
  policy_decision_point_base_url: "http://127.0.0.1:8080"
  admin_email: "admin@example.com"

entities: {}

secrets:
  allow_key_creation: true
  local_key_creation_path: "/var/lib/nemo/nhx-encryption-key.txt"

files:
  default_storage_config:
    type: local
    path: "/var/lib/nemo/files_storage"

jobs:
  executors:
    # One profile per step, each with its own ServiceAccount.
    - provider: cpu
      profile: build-fetch
      backend: kubernetes_job
      config: &build_profile
        namespace: nhx-builds
        service_account_name: nhx-build-fetch
        # The platform image ships /tools/jobs-launcher.
        launcher_image: nhx-api-builder:local
        default_task_image: nhx-build:local
        storage:
          pvc_name: nhx-build-work
        node_selector:
          nhx.nvidia.com/build-node: "true"
        cleanup_completed_jobs_immediately: false
        ttl_seconds_after_finished: 3600
        resources:
          requests:
            cpu: "100m"
            memory: 256Mi

    - provider: cpu
      profile: build-control
      backend: kubernetes_job
      config:
        <<: *build_profile
        service_account_name: nhx-build-control

    - provider: cpu
      profile: build-push
      backend: kubernetes_job
      config:
        <<: *build_profile
        service_account_name: nhx-build-push

  executor_defaults:
    kubernetes_job:
      cleanup_completed_jobs_immediately: false
      ttl_seconds_after_finished: 3600

builder:
  namespace: nhx-builds
  work_pvc: nhx-build-work
  sandbox_image: nhx-kaniko:local

  # Plain HTTP. Never against a registry holding real artifacts: the builder signs the digest the
  # registry reports, which HTTP leaves unauthenticated.
  registry: http://registry.nhx-registry.svc.cluster.local:5000
  repository_prefix: ""

  # The local token service grants only what was asked for.
  registry_narrows_scope: true

  # The credential broker's credential for the local token service, and its signing key, both
  # mounted into the platform (deploy/platform.yaml). The key has no password. `signing_public_key`
  # comes from the `nhx-build-signing-public-key` ConfigMap, as an environment variable.
  registry_username: builder
  registry_password_file: /var/run/secrets/nhx-token-server/token
  signing_key: /var/run/nhx-builder/signing/signing.key

  sandbox_cpu: "500m"
  sandbox_memory: 1Gi
